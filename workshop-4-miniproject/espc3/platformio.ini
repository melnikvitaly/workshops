; PlatformIO Project Configuration File
;
; SPI-master data-log collector for the ESP32-C3 DevKitM.
; On the C3, GPIO11-17 belong to the SPI flash, 18/19 are USB and 20/21 are the
; UART0 console, so the bus/CS pins are chosen from the remaining free GPIOs.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
